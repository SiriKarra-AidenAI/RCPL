spring:
  application:
    name: rcpl-platform
  datasource:
    # Oracle. Local dev matches docker-compose (Oracle Database Free, service FREEPDB1).
    url: ${DATABASE_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${DB_USER:rcpl}
    password: ${DB_PASSWORD:rcpl}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
  jpa:
    hibernate:
      # Flyway owns the schema; never let Hibernate mutate it.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: false
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
  mail:
    # IMAP intake mailbox (deterministic parsing, no LLM).
    host: ${IMAP_HOST:imap.example.com}
    port: ${IMAP_PORT:993}
    username: ${IMAP_USER:}
    password: ${IMAP_PASSWORD:}
    properties:
      mail:
        store:
          protocol: imaps

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  cors:
    # Comma-separated origins allowed to call the API (Angular dev server by default).
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200,http://localhost:5173}
  jwt:
    # MUST be overridden in every real environment. HS256 secret, >= 32 bytes.
    secret: ${JWT_SECRET:change-me-please-use-a-32-byte-minimum-dev-secret}
    # Token lifetime in minutes.
    ttl-minutes: ${JWT_TTL_MINUTES:720}
    issuer: rcpl-platform
  intake:
    # Toggle the background IMAP poller. Off by default so the app runs without a mailbox.
    poll-enabled: ${INTAKE_POLL_ENABLED:false}
    poll-interval-ms: ${INTAKE_POLL_INTERVAL_MS:300000}
    folder: ${INTAKE_FOLDER:INBOX}
    auto-forward-unmatched: ${INTAKE_AUTO_FORWARD:true}
  mail:
    smtp:
      # Outbound mail (POST /api/mail/reply) — separate, distinct properties from spring.mail.*,
      # which is the IMAP intake mailbox above. Off by default so the app runs without real
      # SMTP credentials; when disabled, sends are logged, not actually delivered.
      host: ${SMTP_HOST:smtp.example.com}
      port: ${SMTP_PORT:587}
      username: ${SMTP_USER:}
      password: ${SMTP_PASSWORD:}
      from: ${SMTP_FROM:no-reply@rcpl.example.com}
      enabled: ${SMTP_ENABLED:false}

springdoc:
  swagger-ui:
    path: /swagger-ui
